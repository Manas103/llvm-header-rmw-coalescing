import os
import lit.formats

config.name = "rmw-coalesce"
config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = [".ll"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.join(os.path.dirname(__file__), "..", "build_test")

opt_bin = os.environ.get("OPT_BIN", "opt-14")
filecheck_bin = os.environ.get("FILECHECK_BIN", "FileCheck-14")
plugin_path = os.environ.get("RMW_PLUGIN_PATH")
if not plugin_path:
    raise RuntimeError("set RMW_PLUGIN_PATH to the built libRmwCoalesce.so before running lit")

config.substitutions.append(("opt", opt_bin))
config.substitutions.append(("FileCheck", filecheck_bin))
config.substitutions.append(("%llvm_pass_plugin", plugin_path))
